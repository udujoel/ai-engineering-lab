<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLM Engineering Flight Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: the course as a token sequence on top, lesson text on the left, a live instrument on the right, telemetry tray at the bottom. */
  /* White ink in five steps on black. Orange only for what is changing right now. */
  --bg: #060606;
  --ink: #f3f2ee;
  --ink-2: rgb(243 242 238 / 0.64);
  --ink-3: rgb(243 242 238 / 0.40);
  --ink-4: rgb(243 242 238 / 0.22);
  --ink-5: rgb(243 242 238 / 0.10);
  --hot: #ff5a1f;
  --hot-wash: rgb(255 90 31 / 0.30);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fast: 120ms;
  --fade: 450ms;
  --pin: 600ms cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 12px/1.6 var(--mono);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--hot); outline-offset: 2px; }

header {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--ink-5);
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
}
header b { color: var(--ink); font-weight: 700; }
header .dot { display: inline-block; width: 6px; height: 6px; background: var(--hot); margin-right: 8px; vertical-align: 1px; }

#seq { padding-block: 4px 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--ink-5); overflow-x: auto; }
#seq-inner { position: relative; min-width: 1040px; }
#seq svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#seq .cap { height: 58px; font-size: 10px; color: var(--ink-3); padding-top: 4px; }
#seq-row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.mod {
  position: relative; display: flex; gap: 8px; align-items: baseline; cursor: pointer;
  padding: 6px 8px 9px; border: 1px solid var(--ink-4); background: none; text-align: left;
  font-size: 11px; color: var(--ink-2);
  transition: border-color var(--fast) linear, color var(--fast) linear, background var(--fast) linear;
}
.mod .n { font-size: 9px; color: var(--ink-3); }
.mod:hover { border-color: var(--ink-2); color: var(--ink); }
.mod[aria-current="true"] { border-color: var(--ink); color: var(--ink); background: var(--ink-5); font-weight: 700; }
.mod .bar { position: absolute; left: -1px; right: -1px; bottom: -1px; height: 3px; background: var(--ink-5); }
.mod .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--p) * 100%); background: var(--ink); transition: width 300ms linear; }

main { display: grid; grid-template-columns: minmax(300px, 42ch) minmax(0, 1fr); min-height: 0; }
#lesson { overflow-y: auto; padding: 20px 22px 28px; border-right: 1px solid var(--ink-5); }
#lesson .num { font-size: 76px; font-weight: 100; line-height: 0.9; letter-spacing: -0.05em; }
#lesson .kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); margin-top: 14px; }
#lesson h1 { font-size: 21px; line-height: 1.25; font-weight: 750; margin: 4px 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
#lesson p { color: var(--ink-2); margin: 0 0 14px; max-width: 62ch; }
#lesson .try { border-left: 2px solid var(--hot); padding: 2px 0 2px 10px; color: var(--ink); }
#lesson h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); font-weight: 500; margin: 22px 0 8px; display: flex; justify-content: space-between; }
#lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#lessons button {
  width: 100%; display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center;
  background: none; border: 0; padding: 5px 0; cursor: pointer; text-align: left; color: var(--ink-2);
}
#lessons button:hover { color: var(--ink); }
#lessons .box { width: 10px; height: 10px; border: 1px solid var(--ink-3); }
#lessons [aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); }
#lessons [aria-pressed="true"] { color: var(--ink-3); }
#lessons .min { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--ink-3); }
#lessons .min i { display: block; height: 1px; background: var(--ink-3); }
.lab { border: 1px dashed var(--ink-4); padding: 10px 12px; color: var(--ink-2); }
.lab b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); font-weight: 500; margin-bottom: 4px; }

#deck { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; padding: 16px 20px 12px; gap: 12px; }
#stage {
  position: relative; min-height: 0; overflow: hidden;
  border: 1px solid var(--ink-5);
  background:
    linear-gradient(var(--ink-2), var(--ink-2)) top left / 10px 1px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) top left / 1px 10px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) top right / 10px 1px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) top right / 1px 10px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) bottom left / 10px 1px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) bottom left / 1px 10px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) bottom right / 10px 1px no-repeat,
    linear-gradient(var(--ink-2), var(--ink-2)) bottom right / 1px 10px no-repeat;
}
#stage > .inst { position: absolute; inset: 0; animation: pin var(--pin) both; }
@keyframes pin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#stage .tag { position: absolute; top: 8px; right: 14px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); pointer-events: none; z-index: 2; }
#controls { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; min-height: 64px; }

footer {
  display: flex; gap: 22px; align-items: center; padding-block: 7px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--ink-5);
  font-size: 10px; color: var(--ink-3); overflow-x: auto; white-space: nowrap;
}
footer b { color: var(--ink); font-weight: 500; }
footer .hot b { color: var(--hot); }
footer .hint { margin-left: auto; color: var(--ink-4); }

.ctl { display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.ctl output { color: var(--ink); min-width: 6ch; text-transform: none; letter-spacing: 0; }
input[type="range"] { appearance: none; -webkit-appearance: none; width: 140px; height: 18px; background: transparent; margin: 0; cursor: ew-resize; }
input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--ink-3); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4.5px; background: var(--ink); border: 0; border-radius: 0; }
input[type="range"]:active::-webkit-slider-thumb { background: var(--hot); }
input[type="range"]::-moz-range-track { height: 1px; background: var(--ink-3); }
input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; background: var(--ink); border: 0; border-radius: 0; }
input[type="range"]:active::-moz-range-thumb { background: var(--hot); }
.btn, .seg button {
  cursor: pointer; border: 1px solid var(--ink-4); background: none; padding: 4px 9px;
  font-size: 10px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em;
  transition: border-color var(--fast) linear, color var(--fast) linear, background var(--fast) linear;
}
.btn:hover, .seg button:hover { border-color: var(--ink-2); color: var(--ink); }
.btn[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { gap: 0; }
.seg .lbl { margin-right: 10px; }
.seg button + button { border-left: 0; }
.dial { display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.dial svg { width: 58px; height: 58px; cursor: ns-resize; touch-action: none; overflow: visible; }
.dial output { color: var(--ink); text-transform: none; font-size: 13px; font-weight: 700; }
.dial .sub { display: block; font-size: 9px; color: var(--ink-3); }

.cv { display: block; width: 100%; height: 100%; touch-action: none; }
.fill { position: absolute; inset: 0; }
.cap { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); margin-bottom: 6px; }

/* 01 tokens */
.tok { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px; padding: 22px; overflow: auto; }
.tok textarea {
  width: 100%; resize: none; background: none; color: var(--ink); border: 0; border-bottom: 1px solid var(--ink-4);
  font: 14px/1.6 var(--mono); padding: 4px 0 8px; outline: none; min-height: 5.4em;
}
.tok textarea:focus { border-bottom-color: var(--hot); }
.tok-flow { display: flex; flex-wrap: wrap; gap: 5px 3px; align-content: flex-start; }
.chip {
  display: inline-flex; flex-direction: column; border: 1px solid var(--ink-4); padding: 3px 6px 2px;
  font-size: 15px; line-height: 1.25; white-space: pre; color: var(--ink);
  transition: color var(--fade) linear, border-color var(--fade) linear;
}
.chip:nth-of-type(even) { background: var(--ink-5); }
.chip b { font-weight: 400; }
.chip i { font-style: normal; font-size: 9px; color: var(--ink-3); }
.chip .sp { color: var(--ink-4); }
.chip.new { color: var(--hot); border-color: var(--hot); transition: none; }
.tok-flow .br { flex-basis: 100%; height: 0; }
.ids .chip b { display: none; }
.ids .chip i { font-size: 14px; color: var(--ink); }

/* 03 attention */
.att { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding: 22px; }
.att-line { display: flex; flex-wrap: wrap; gap: 2px 0.5em; font-size: 22px; line-height: 1.45; }
.att-line span { padding: 0 3px; cursor: default; transition: font-weight 200ms linear, opacity var(--fast) linear; }
.att-line span.q { color: var(--hot); box-shadow: inset 0 -2px var(--hot); }
.att-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); gap: 18px; min-height: 0; }
.att-body svg { width: 100%; height: 100%; }
.att-heat { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.att-heat .note { font-size: 10px; color: var(--ink-3); }
.att-svg text { font-family: var(--mono); font-size: 13px; fill: var(--ink); cursor: default; }
.att-svg .hd { font-size: 9px; fill: var(--ink-3); letter-spacing: 0.1em; }

/* 04 sampling */
.samp { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; padding: 22px; }
.prompt { font-size: 16px; color: var(--ink-2); }
.prompt .next { color: var(--hot); border-bottom: 1px solid var(--hot); padding: 0 2px; }
.bars { display: grid; align-content: center; gap: 5px; }
.bars .row { display: grid; grid-template-columns: 10ch minmax(0, 1fr) 7ch; gap: 12px; align-items: center; font-size: 13px; transition: color var(--fade) linear; }
.bars .row .p { text-align: right; color: var(--ink-2); font-size: 11px; }
.bars .track { position: relative; height: 14px; }
.bars .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--ink-5); }
.bars .ghost { position: absolute; left: 0; top: 0; bottom: 0; border: 1px dashed var(--ink-4); border-left: 0; }
.bars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); transition: background var(--fade) linear; }
.bars .emp { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--hot); opacity: 0.85; }
.bars .row.cut { color: var(--ink-4); }
.bars .row.flash { color: var(--hot); transition: none; }
.bars .row.flash .fill { background: var(--hot); transition: none; }
.strip { display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; font-size: 11px; color: var(--ink-3); white-space: nowrap; min-height: 18px; }
.strip span:first-child { color: var(--hot); }

/* 05 context */
.ctx { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.ctx .cvwrap { position: relative; min-height: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 22px 16px; font-size: 10px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; display: inline-block; }
.sw-system { background: var(--ink); }
.sw-tools { background: rgb(243 242 238 / 0.55); }
.sw-examples { border: 1px solid var(--ink-3); background: linear-gradient(135deg, transparent 45%, var(--ink) 45% 55%, transparent 55%); }
.sw-docs { background: radial-gradient(circle, var(--ink) 30%, transparent 32%); }
.sw-history { border: 1px solid rgb(243 242 238 / 0.7); }
.sw-user { background: var(--ink); box-shadow: inset 0 0 0 3px var(--bg); outline: 1px solid var(--ink); outline-offset: -1px; }
.sw-reserve { border: 1px dashed var(--ink-3); }
.sw-free { background: radial-gradient(circle, var(--ink-4) 20%, transparent 22%); }

/* 06 rag */
.rag { display: grid; grid-template-columns: minmax(0, 1fr) 250px; }
.rag .cvwrap { position: relative; min-height: 0; }
.rag aside { border-left: 1px solid var(--ink-5); padding: 18px 16px; overflow: auto; }
.rag ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rag li { display: grid; grid-template-columns: 3ch 6ch minmax(0, 1fr) 2ch; gap: 8px; align-items: center; font-size: 11px; color: var(--ink-2); }
.rag li .sb { height: 6px; background: var(--ink-5); position: relative; }
.rag li .sb i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
.rag li .g { color: var(--ink); }
.rag li.gold { color: var(--ink); }
.rag .sum { margin-top: 14px; font-size: 11px; color: var(--ink-2); display: grid; gap: 2px; }
.rag .sum b { color: var(--ink); font-weight: 600; }

/* 07 agents */
.agent { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.agent svg { width: 100%; height: 100%; }
.agent svg text { font-family: var(--mono); }
.trace { border-left: 1px solid var(--ink-5); padding: 18px 16px; overflow: hidden; display: flex; flex-direction: column; }
.trace ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.trace li { display: grid; grid-template-columns: 2ch 8ch minmax(0, 1fr); gap: 6px; font-size: 11px; color: var(--ink-2); transition: color 1.2s linear; }
.trace li .ph { color: var(--ink-3); text-transform: uppercase; font-size: 9px; padding-top: 2px; }
.trace li.new { color: var(--hot); transition: none; }
.trace li.err { color: var(--hot); }
.trace li.done { color: var(--ink); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  #stage > .inst { animation: none; }
}
@media (max-width: 900px) {
  body { display: block; height: auto; }
  main { display: block; }
  #lesson { border-right: 0; border-bottom: 1px solid var(--ink-5); padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #deck { padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #stage { height: 72vh; min-height: 460px; }
  header, #seq, footer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .att-body { grid-template-columns: 1fr; }
  .att-heat { display: none; }
  .rag { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .rag aside { border-left: 0; border-top: 1px solid var(--ink-5); max-height: 220px; }
  .agent { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .trace { border-left: 0; border-top: 1px solid var(--ink-5); }
  .ctl { flex-wrap: wrap; max-width: 100%; }
  .seg { row-gap: 6px; }
}

/* path: groups and status */
#seq .groups { display: grid; grid-template-columns: 6fr 4fr; gap: 6px; margin-top: 8px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
#seq .groups span { border-top: 1px solid var(--ink-4); padding-top: 4px; }
#seq .groups span + span { border-top-style: dashed; }
.mod .pip { margin-left: auto; font-size: 10px; color: var(--ink-3); }
.mod.done .pip { color: var(--ink); }
.mod.now .pip { color: var(--hot); }
.mod.later { border-style: dashed; }

.status { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 14px; }
.pill { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; padding: 2px 7px; border: 1px solid var(--ink-4); color: var(--ink-2); }
.pill.done { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.now { border-color: var(--hot); color: var(--hot); }
.pill.next { border-style: dashed; color: var(--ink); }
.pill.sim { border-style: dashed; color: var(--ink-3); }
.pill.real { border-color: var(--ink-2); color: var(--ink); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.facts li { display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 10px; color: var(--ink-2); }
.facts li b { color: var(--ink); font-weight: 700; text-align: right; white-space: nowrap; }
.run { display: block; margin-top: 8px; padding: 7px 9px; background: var(--ink-5); color: var(--ink); white-space: pre-wrap; word-break: break-word; font-size: 11px; }
.stage-tag-sim { color: var(--hot) !important; }

/* shared bar rows (DOM charts) */
.hbars { display: grid; gap: 6px; align-content: start; }
.hb { display: grid; grid-template-columns: 11ch minmax(0, 1fr) 13ch; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-2); }
.hb .tr { position: relative; height: 16px; background: linear-gradient(var(--ink-5), var(--ink-5)) 0 50% / 100% 1px no-repeat; }
.hb .f { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--ink); transition: width 300ms cubic-bezier(0.16, 1, 0.3, 1); }
.hb .f2 { position: absolute; top: 2px; bottom: 2px; border: 1px solid var(--ink-2); background: repeating-linear-gradient(135deg, transparent 0 3px, var(--ink-4) 3px 4px); transition: left 300ms, width 300ms; }
.hb .v { text-align: right; color: var(--ink); font-size: 11px; }
.hb.best { color: var(--hot); }
.hb.best .f { background: var(--hot); }
.hb.best .v { color: var(--hot); }
.hb .tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.sub-ctl { display: contents; }

/* 00 inside */
.inside { display: grid; grid-template-rows: auto auto minmax(90px, 1fr) auto; gap: 14px; padding: 20px 22px; overflow: auto; }
.inside .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: stretch; }
.inside .chip { cursor: default; }
.inside .chip.last { border-color: var(--hot); }
.model-box { position: relative; border: 1px solid var(--ink-3); padding: 8px 10px; display: grid; gap: 6px; }
.model-box .layers { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 16px; }
.model-box .layers i { background: var(--ink-5); transition: background 160ms linear; }
.model-box .layers i.on { background: var(--hot); transition: none; }
.model-box .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--ink-3); }
.model-box .meta b { color: var(--ink); font-weight: 500; }
.logit-wrap { position: relative; min-height: 90px; }
.probs .hb { grid-template-columns: 9ch minmax(0, 1fr) 7ch; cursor: default; }
.probs .hb.rest { color: var(--ink-3); }
.probs .hb.rest .f { background: none; border: 1px dashed var(--ink-4); }

/* 02 tokens */
.tz { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; padding: 20px 22px; overflow: auto; }
.tz .sample { border: 1px solid var(--ink-5); padding: 8px 10px; font-size: 12px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: auto; }
.tz .note { font-size: 11px; color: var(--ink-2); border-left: 2px solid var(--hot); padding-left: 10px; max-width: 70ch; }
.tz .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-content: start; }
.splits { border-collapse: collapse; font-size: 12px; width: 100%; }
.splits th { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); font-weight: 500; text-align: left; padding: 4px 8px 6px 0; }
.splits td { padding: 5px 8px 5px 0; border-top: 1px solid var(--ink-5); vertical-align: top; }
.splits td:first-child { color: var(--ink-2); white-space: nowrap; }

function decode(T, K, P, greedy) {

  const entropy = -p.reduce((a, x) => (x > 0 ? a + x * Math.log2(x) : a), 0)
  return { raw, p, kept, entropy }

      const st = STAGES(), sx = (i) => 30 + (i * (w - 60)) / (st.length - 1)
      ctx.strokeStyle = ink(0.3); ctx.beginPath(); ctx.moveTo(sx(0), 30.5); ctx.lineTo(sx(st.length - 1), 30.5); ctx.stroke()
      ctx.font = `500 9px ${FONT}`; ctx.textAlign = "center"
      st.forEach(([name, ms], i) => {

        if (off) ctx.setLineDash([2, 2])
        ctx.strokeRect(sx(i) - 3.5, 26.5, 7, 7); ctx.setLineDash([])
        ctx.fillStyle = ink(off ? 0.25 : 0.7)
        ctx.fillText(name.toUpperCase(), sx(i), 18)
        ctx.fillText(off ? "off" : ms ? ms + " ms" : "", sx(i), 48)
      })
      const p = reduced ? 0 : (t % 2400) / 2400
      const px = sx(0) + p * (sx(st.length - 1) - sx(0))
      ctx.fillStyle = hot(); ctx.fillRect(px - 3, 27, 6, 6)
      ctx.setLineDash([3, 3]); ctx.strokeStyle = ink(0.3)
      ctx.beginPath(); ctx.ellipse(X(A.x), Y(A.y), 0.09 * (w - 40), 0.09 * (H - 90), 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([])
      ctx.fillStyle = ink(0.35); ctx.textAlign = "center"; ctx.fillText("WHERE THE ANSWER LIVES", X(A.x), Y(A.y) - 0.09 * (H - 90) - 6)
      const E = eff()
      const picked = new Set(res.list.map((r) => r.d))
      res.list.forEach((r) => { ctx.strokeStyle = hot(0.55); ctx.beginPath(); ctx.moveTo(X(E.x), Y(E.y)); ctx.lineTo(X(r.d.x), Y(r.d.y)); ctx.stroke() })
      for (const d of dots) {
        const x = X(d.x), y = Y(d.y)
        if (picked.has(d)) { ctx.fillStyle = ink(1); ctx.fillRect(x - 3, y - 3, 6, 6) }
        else { ctx.fillStyle = ink(0.35); ctx.fillRect(x - 1, y - 1, 2, 2) }
        if (d.gold) { ctx.strokeStyle = ink(0.9); ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke() }
      }
      res.list.forEach((r, i) => { ctx.fillStyle = ink(0.9); ctx.textAlign = "left"; ctx.fillText(String(i + 1), X(r.d.x) + 8, Y(r.d.y) - 6) })
      if (rewrite) { arrow(ctx, X(Q.x), Y(Q.y), X(E.x), Y(E.y), hot(0.8), 1); ctx.fillStyle = hot(); ctx.fillText("rewritten", X(E.x) + 10, Y(E.y) + 14) }
      const qx = X(Q.x), qy = Y(Q.y)
      ctx.strokeStyle = hot(); ctx.lineWidth = 1.5
      ctx.beginPath(); ctx.arc(qx, qy, 8, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1
      ctx.beginPath(); ctx.moveTo(qx - 16, qy); ctx.lineTo(qx + 16, qy); ctx.moveTo(qx, qy - 16); ctx.lineTo(qx, qy + 16); ctx.stroke()
      ctx.fillStyle = hot(); ctx.textAlign = "left"; ctx.font = `600 10px ${FONT}`
      ctx.fillText("QUERY · drag me", qx + 12, qy - 12)
    },
    telemetry() {
      const lat = STAGES().reduce((a, [, ms]) => a + ms, 0)
      return [["recall@" + k, Math.round(res.recall * 100) + "%", res.recall < 0.5], ["precision", Math.round(res.precision * 100) + "%"], ["chunks in store", dots.length], ["context tokens", (k * chunk).toLocaleString("en")], ["latency", lat.toLocaleString("en") + " ms"]]
    },
  }
}

/* 07 agents */
const SCRIPT = [
  { ph: "plan", txt: "Find out why the prod release pipeline failed" },
  { ph: "act", txt: "az pipelines runs show --id 4812" },
  { ph: "observe", txt: "stage terraform_apply exited 1: state lock held" },
  { ph: "reflect", txt: "Lock is 2h old. The run holding it was cancelled." },
  { ph: "act", txt: "az storage blob lease show tfstate/prod.tfstate" },
  { ph: "observe", txt: "lease held by run 4809, status cancelled" },
  { ph: "plan", txt: "Release the stale lock, then re-run apply" },
  { ph: "act", txt: "terraform force-unlock 8c1e2f", gated: true },
  { ph: "observe", txt: "lock released" },
  { ph: "act", txt: "az pipelines run --name release-prod" },
  { ph: "observe", txt: "run 4813 succeeded, apply clean, 0 drift" },
  { ph: "reflect", txt: "Done. Post a summary to the incident channel." },
]
const PH = { plan: { a: 0, r: 1, g: "◇" }, act: { a: 90, r: 1, g: "→" }, observe: { a: 180, r: 1, g: "←" }, reflect: { a: 270, r: 1, g: "↺" }, gate: { a: 90, r: 1.52, g: "■" }, done: { a: 0, r: 0, g: "✓" } }
function makeAgent(stage, ctl) {
  let idx = 0, pending = [], guard = true, injectErr = false, speed = 1100, last = 0, steps = 0, tools = 0, tokens = 0, approvals = 0, from = "done", to = "done", movedAt = 0
  const R = rng(3)
  const svg = svgEl("svg", { viewBox: "0 0 420 420", preserveAspectRatio: "xMidYMid meet" })
  const cx = 180, cy = 210, rad = 128
  svgEl("circle", { cx, cy, r: rad, fill: "none", stroke: ink(0.14) }, svg)
  for (let a = 45; a < 360; a += 90) {
    const [x, y] = polar(cx, cy, rad, a)
    svgEl("path", { d: `M-4,-4L0,0L-4,4`, transform: `translate(${x},${y}) rotate(${a})`, fill: "none", stroke: ink(0.4) }, svg)
  }
  const gateLink = svgEl("line", { x1: cx + rad + 30, y1: cy, x2: cx + rad * 1.52 - 22, y2: cy, stroke: ink(0.4), "stroke-dasharray": "3 3" }, svg)
  const nodes = {}
  for (const k of ["plan", "act", "observe", "reflect", "gate"]) {
    const { a, r } = PH[k]
    const [x, y] = polar(cx, cy, rad * r, a)
    const g = svgEl("g", { transform: `translate(${x},${y})` }, svg)
    const shape = k === "gate"
      ? svgEl("rect", { x: -22, y: -22, width: 44, height: 44, fill: "#060606", stroke: ink(0.5), "stroke-dasharray": "3 3" }, g)
      : svgEl("circle", { r: 30, fill: "#060606", stroke: ink(0.4) }, g)
    const label = svgEl("text", { "text-anchor": "middle", y: 4, "font-size": 10, fill: ink(0.8), "letter-spacing": "0.08em" }, g)
    label.textContent = k === "gate" ? "HUMAN" : k.toUpperCase()
    nodes[k] = { g, shape, label }
  }
  const center = svgEl("text", { x: cx, y: cy - 4, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: ink(1) }, svg)
  center.textContent = "LLM"
  const centerSub = svgEl("text", { x: cx, y: cy + 14, "text-anchor": "middle", "font-size": 9, fill: ink(0.4) }, svg)
  const pulse = svgEl("circle", { r: 5, fill: hot() }, svg)
  const ol = h("ol")
  stage.append(h("div", { class: "inst agent" }, svg, h("div", { class: "trace" }, h("span", { class: "cap" }, "trace · newest at the bottom"), ol)))
  ctl.append(
    slider({ label: "step every", min: 400, max: 2400, step: 100, value: speed, fmt: (v) => (v / 1000).toFixed(1) + " s", onInput: (v) => (speed = v) }),
    toggle("approval gate", true, (v) => (guard = v)),
    btn("inject tool error", () => (injectErr = true)),
  )
  function nextStep() {
    if (pending.length) { if (pending[0].notBefore && performance.now() < pending[0].notBefore) return null; return pending.shift() }
    if (idx >= SCRIPT.length) { idx = 0; return { ph: "done", txt: "Run complete. Summary posted to #incidents.", done: true } }
    const s = SCRIPT[idx++]
    if (s.gated && guard) {
      pending.push({ ph: "gate", txt: "approved by on-call engineer" }, { ph: "act", txt: s.txt })
      return { ph: "gate", txt: "needs approval: force-unlock changes prod state" }
    }
    if (s.ph === "act" && injectErr) {
      injectErr = false
      pending.push({ ph: "observe", txt: "error 429: too many requests", err: true }, { ph: "reflect", txt: "Transient. Back off 2s and retry once." }, { ph: "act", txt: s.txt + " (retry)", backoff: true })
    }
    if (s.gated && !guard) return { ...s, txt: s.txt + "  · ran without approval", err: true }
    return s
  }
  function push(s) {
    if (s.err && s.ph === "observe") { const r = pending.find((x) => x.backoff); if (r) r.notBefore = performance.now() + 2000 }
    steps++
    if (s.ph === "act") tools++
    if (s.ph === "gate" && s.txt.startsWith("approved")) approvals++
    tokens += 250 + Math.round(R() * 650)
    from = to; to = s.ph; movedAt = performance.now()
    const li = h("li", { class: "new" + (s.err ? " err" : "") + (s.done ? " done" : "") }, h("span", {}, PH[s.ph].g), h("span", { class: "ph" }, s.ph), h("span", {}, s.txt))
    ol.append(li)
    setTimeout(() => li.classList.remove("new"), 60)
    while (ol.children.length > 15) ol.firstChild.remove()
  }
  return {
    frame(t) {
      if (t - last > speed) { const s = nextStep(); if (s) { last = t; push(s) } }
      gateLink.style.display = nodes.gate.g.style.display = guard ? "" : "none"
      for (const [k, n] of Object.entries(nodes)) {
        const on = k === to
        n.shape.setAttribute("stroke", on ? hot() : ink(k === "gate" ? 0.5 : 0.4))
        n.shape.setAttribute("stroke-width", on ? 2 : 1)
        n.label.setAttribute("fill", on ? hot() : ink(0.8))
      }
      centerSub.textContent = tokens.toLocaleString("en") + " tokens"
      const p = reduced ? 1 : clamp((performance.now() - movedAt) / 420, 0, 1)
      const e = 1 - Math.pow(1 - p, 4)
      const A = PH[from], B = PH[to]
      let a0 = A.a, a1 = B.a
      if (a1 < a0 && !(B.r === 0 || A.r === 0)) a1 += 360
      const [x, y] = polar(cx, cy, rad * lerp(A.r, B.r, e), lerp(a0, a1, e))
      pulse.setAttribute("cx", x); pulse.setAttribute("cy", y)
    },
    telemetry() {
      return [["phase", to, true], ["steps", steps], ["tool calls", tools], ["approvals", approvals], ["tokens", tokens.toLocaleString("en")], ["cost", "$" + ((tokens * 6) / 1e6).toFixed(4)]]
    },
  }
}

/* 08 evals and serving */
function makeEvals(stage, ctl) {
  const R = rng(42)
  const v3 = Array.from({ length: 200 }, () => clamp(76 + gauss(R) * 13, 0, 100))
  const v4 = [...Array.from({ length: 184 }, () => clamp(86 + gauss(R) * 7.5, 0, 100)), ...Array.from({ length: 16 }, () => clamp(31 + gauss(R) * 7, 0, 100))]
  let thr = 70, rps = 18, cache = false, ttft = [], tps = [], lastTick = 0, dragging = false, cur = { p95: 0, tps: 0, err: 0 }
  const root = h("div", { class: "inst fill" })
  stage.append(root)
  const c = makeCanvas(root)
  const pass = (arr) => arr.filter((x) => x >= thr).length / arr.length
  const thrCtl = slider({ label: "pass threshold", min: 40, max: 100, step: 1, value: thr, onInput: (v) => (thr = v) })
  ctl.append(thrCtl,
    slider({ label: "load", min: 1, max: 60, step: 1, value: rps, fmt: (v) => v + " req/s", onInput: (v) => (rps = v) }),
    toggle("prompt cache", false, (v) => (cache = v)))
  let hx = { x0: 0, x1: 0, top: 0, bottom: 0 }
  const setFrom = (e) => { const p = localPoint(c.cv, e); thr = Math.round(clamp(((p.x - hx.x0) / (hx.x1 - hx.x0)) * 100, 40, 100)); thrCtl.set(thr) }
  c.cv.addEventListener("pointerdown", (e) => { const p = localPoint(c.cv, e); if (p.y > hx.top && p.y < hx.bottom) { dragging = true; c.cv.setPointerCapture(e.pointerId); setFrom(e) } })
  c.cv.addEventListener("pointermove", (e) => dragging && setFrom(e))
  c.cv.addEventListener("pointerup", () => (dragging = false))
  function tick() {
    const cap = 40, u = Math.min(rps / cap, 0.97)
    const base = cache ? 150 : 330
    const t1 = base + (110 * u) / (1 - u) + gauss(Math.random) * 18
    cur = { p95: Math.max(80, t1 * 1.55), tps: Math.max(5, 96 * (1 - 0.45 * u) + gauss(Math.random) * 2.5), err: rps > cap ? (rps - cap) / rps : 0 }
    ttft.push(cur.p95); tps.push(cur.tps)
    if (ttft.length > 160) { ttft.shift(); tps.shift() }
  }
  for (let i = 0; i < 160; i++) tick()
  function spark(ctx, x, y, w, hh, data, max, title, unit, warnAt) {
    ctx.strokeStyle = ink(0.08)
    for (let i = 0; i <= 3; i++) { const yy = Math.round(y + (i * hh) / 3) + 0.5; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke() }
    ctx.font = `500 9px ${FONT}`; ctx.fillStyle = ink(0.4); ctx.textAlign = "left"
    ctx.fillText(title, x, y - 8)
    ctx.textAlign = "right"; ctx.fillText(max + " " + unit, x + w, y - 8)
    if (warnAt) { const wy = y + hh * (1 - warnAt / max); ctx.setLineDash([3, 3]); ctx.strokeStyle = hot(0.6); ctx.beginPath(); ctx.moveTo(x, wy); ctx.lineTo(x + w, wy); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = hot(0.8); ctx.textAlign = "left"; ctx.fillText("SLO " + warnAt + " " + unit, x + 4, wy - 4) }
    const pt = (i) => [x + (i / (data.length - 1)) * w, y + hh * (1 - clamp(data[i] / max, 0, 1))]
    ctx.beginPath(); data.forEach((_, i) => { const [a, b] = pt(i); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b) })
    ctx.strokeStyle = ink(0.9); ctx.lineWidth = 1.25; ctx.stroke(); ctx.lineWidth = 1
    ctx.lineTo(x + w, y + hh); ctx.lineTo(x, y + hh); ctx.closePath(); ctx.fillStyle = ink(0.06); ctx.fill()
    const [ex, ey] = pt(data.length - 1)
    ctx.fillStyle = hot(); ctx.beginPath(); ctx.arc(ex, ey, 3, 0, Math.PI * 2); ctx.fill()
    ctx.textAlign = "right"; ctx.font = `700 11px ${FONT}`; ctx.fillText(Math.round(data[data.length - 1]) + " " + unit, ex - 6, ey - 8)
  }
  return {
    dispose: c.dispose,
    frame(t) {
      if (t - lastTick > 120) { lastTick = t; tick() }
      const { ctx, w, h: H } = c
      ctx.clearRect(0, 0, w, H)
      const pad = 26, topH = Math.round(H * 0.52)
      const x0 = pad, x1 = w - pad, y0 = 46, y1 = topH - 26
      hx = { x0, x1, top: y0 - 20, bottom: y1 + 20 }
      const bins = 20, bw = (x1 - x0) / bins
      const hist = (arr) => { const b = Array(bins).fill(0); arr.forEach((v) => b[Math.min(bins - 1, Math.floor(v / 5))]++); return b }
      const h3 = hist(v3), h4 = hist(v4), mx = Math.max(...h3, ...h4)
      const yb = (n) => y1 - (n / mx) * (y1 - y0)
      ctx.font = `500 9px ${FONT}`; ctx.fillStyle = ink(0.4); ctx.textAlign = "left"
      ctx.fillText("EVAL SCORES · 200 CASES · FILLED = PROMPT V4 CANDIDATE · OUTLINE = V3 IN PROD", x0, 22)
      h4.forEach((n, i) => { ctx.fillStyle = (i + 1) * 5 > thr ? ink(0.8) : ink(0.3); ctx.fillRect(x0 + i * bw + 1, yb(n), bw - 2, y1 - yb(n)) })
      ctx.strokeStyle = ink(0.55); ctx.beginPath()
      h3.forEach((n, i) => { const xa = x0 + i * bw, xb = xa + bw; i ? ctx.lineTo(xa, yb(n)) : ctx.moveTo(xa, yb(n)); ctx.lineTo(xb, yb(n)) }); ctx.stroke()
      ctx.strokeStyle = ink(0.25); ctx.beginPath(); ctx.moveTo(x0, y1 + 0.5); ctx.lineTo(x1, y1 + 0.5); ctx.stroke()
      ctx.fillStyle = ink(0.4); ctx.textAlign = "center"
      for (let s = 0; s <= 100; s += 20) ctx.fillText(String(s), x0 + (s / 100) * (x1 - x0), y1 + 14)
      const cx = x0 + 6.5 * bw
      ctx.strokeStyle = ink(0.5); ctx.beginPath(); ctx.moveTo(cx, yb(Math.max(h4[5], h4[6])) - 4); ctx.lineTo(cx, y0 + 14); ctx.stroke()
      ctx.fillStyle = ink(0.75); ctx.textAlign = "left"; ctx.fillText("16 tool-use cases regressed. The average hides them.", cx + 6, y0 + 16)
      const tx = x0 + (thr / 100) * (x1 - x0)
      ctx.strokeStyle = hot(); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx, y0 - 10); ctx.lineTo(tx, y1); ctx.stroke(); ctx.lineWidth = 1
      ctx.fillStyle = hot(); ctx.fillRect(tx - 5, y0 - 16, 10, 7)
      const p3 = pass(v3), p4 = pass(v4), ok = p4 >= 0.85 && p4 >= p3
      ctx.textAlign = "left"; ctx.font = `600 10px ${FONT}`
      const lx = tx + 10 > x1 - 150 ? tx - 150 : tx + 10
      ctx.fillText(`≥ ${thr}  v4 ${Math.round(p4 * 100)}%  v3 ${Math.round(p3 * 100)}%`, lx, y0 - 8)
      const gate = ok ? "GATE PASS · SHIP V4" : "GATE BLOCK · KEEP V3"
      ctx.font = `700 11px ${FONT}`
      const gw = ctx.measureText(gate).width + 16
      ctx.fillStyle = ok ? ink(1) : hot(); ctx.fillRect(x1 - gw, 10, gw, 18)
      ctx.fillStyle = "#060606"; ctx.textAlign = "left"; ctx.fillText(gate, x1 - gw + 8, 23)
      const sy = topH + 30, sh = H - sy - 22, half = (x1 - x0 - 30) / 2
      spark(ctx, x0, sy, half, sh, ttft, 2500, "P95 TIME TO FIRST TOKEN", "ms", 1200)
      spark(ctx, x0 + half + 30, sy, half, sh, tps, 120, "TOKENS PER SECOND PER STREAM", "tok/s")
    },
    telemetry() {
      const cost = ((2000 * 3 * (cache ? 0.55 : 1) + 400 * 15) / 1e6) * 1000
      return [["v4 pass", Math.round(pass(v4) * 100) + "%"], ["v3 pass", Math.round(pass(v3) * 100) + "%"], ["p95 ttft", Math.round(cur.p95) + " ms", cur.p95 > 1200], ["tok/s", Math.round(cur.tps)], ["errors", Math.round(cur.err * 100) + "%", cur.err > 0], ["per 1k requests", "$" + cost.toFixed(2)]]
    },
  }
}

const STATUS = { done: ["done", "✓"], now: ["in progress", "●"], next: ["up next", "○"], later: ["later", "·"] }

const EXAMPLE_DONE = { "inside:0": 1, "inside:1": 1, "inside:2": 1, "models:0": 1, "models:1": 1, "models:2": 1, "models:3": 1, "tokens:0": 1, "tokens:1": 1, "tokens:2": 1, "tokens:3": 1, "tokens:4": 1 }
const KEY = "deck-done-v2"
let done
try { done = JSON.parse(localStorage.getItem(KEY) || "null") || { ...EXAMPLE_DONE } } catch { done = { ...EXAMPLE_DONE } }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)) } catch {} }
const progress = (i) => MODULES[i].lessons.filter((_, k) => done[`${MODULES[i].id}:${k}`]).length / MODULES[i].lessons.length

let active = 0, current = null
const row = $("#seq-row"), arcs = $("#seq-arcs"), stage = $("#stage"), controls = $("#controls"), lesson = $("#lesson"), tray = $("#tray")

function buildSeq() {
  row.replaceChildren(...MODULES.map((m, i) => {
    const b = h("button", { type: "button", class: "mod " + m.status, "aria-current": String(i === active), style: `--p:${progress(i)}`, title: STATUS[m.status][0] }, h("span", { class: "n" }, m.n), h("span", { class: "nm" }, m.name), h("span", { class: "pip" }, STATUS[m.status][1]), h("span", { class: "bar" }))
    b.onclick = () => go(i)
    return b
  }))
  requestAnimationFrame(drawArcs)
}
function drawArcs() {
  const inner = $("#seq-inner").getBoundingClientRect()
  arcs.setAttribute("viewBox", `0 0 ${inner.width} ${inner.height}`)
  arcs.replaceChildren()
  const pos = [...row.children].map((b) => { const r = b.getBoundingClientRect(); return { x: r.left - inner.left + r.width / 2, y: r.top - inner.top } })
  const edge = (i, j, wgt, mode) => {
    const a = pos[i], b = pos[j], dist = Math.abs(a.x - b.x)
    const apex = a.y - 8 - Math.min(34, dist * 0.08)
    const d = `M${a.x},${a.y}C${a.x},${apex} ${b.x},${apex} ${b.x},${b.y}`
    const attrs = { d, fill: "none" }
    if (mode === "hot") Object.assign(attrs, { stroke: hot(), "stroke-width": (1 + wgt * 4).toFixed(1), "stroke-opacity": 0.4 + 0.6 * wgt })
    else if (mode === "next") Object.assign(attrs, { stroke: ink(0.45), "stroke-dasharray": "3 3" })
    else Object.assign(attrs, { stroke: ink(0.1) })
    svgEl("path", attrs, arcs)
    if (mode === "hot") {
      const t = svgEl("text", { x: (a.x + b.x) / 2, y: apex + 6, "text-anchor": "middle", "font-size": 9, fill: hot(), "font-family": FONT }, arcs)
      t.textContent = wgt.toFixed(1)
    }
  }
  MODULES.forEach((m, i) => Object.entries(m.prereq).forEach(([j, w]) => { if (i !== active && +j !== active) edge(i, +j, w, "faint") }))
  MODULES.forEach((m, i) => Object.entries(m.prereq).forEach(([j, w]) => { if (+j === active) edge(i, +j, w, "next") }))
  Object.entries(MODULES[active].prereq).forEach(([j, w]) => edge(active, +j, w, "hot"))
}
function renderLesson() {
  const m = MODULES[active]
  const list = h("ul", { id: "lessons" }, ...m.lessons.map(([title, min], k) => {
    const key = `${m.id}:${k}`
    const b = h("button", { type: "button", "aria-pressed": String(!!done[key]) }, h("span", { class: "box" }), h("span", {}, title), h("span", { class: "min" }, h("i", { style: `width:${min * 2}px` }), min + "m"))
    b.onclick = () => { done[key] ? delete done[key] : (done[key] = 1); save(); b.setAttribute("aria-pressed", String(!!done[key])); updateProgress() }
    return h("li", {}, b)
  }))
  const total = m.lessons.reduce((a, [, x]) => a + x, 0)
  const sim = m.data.startsWith("simulated")
  lesson.replaceChildren(
    h("div", { class: "num" }, m.n),
    h("div", { class: "kicker" }, `${m.kicker} · ${m.step} · ${m.group === 1 ? "project 1" : "ahead"}`),
    h("h1", {}, m.title),
    h("div", { class: "status" }, h("span", { class: "pill " + m.status }, STATUS[m.status][0]), h("span", { class: "pill " + (sim ? "sim" : "real") }, sim ? "simulated" : "real data")),
    h("p", {}, m.body),
    h("p", { class: "try" }, m.try),
    m.facts.length ? h("h2", {}, h("span", {}, "What you measured"), h("span", {}, "")) : null,
    m.facts.length ? h("ul", { class: "facts" }, ...m.facts.map(([k, v]) => h("li", {}, h("b", {}, k), h("span", {}, v)))) : null,
    h("h2", {}, h("span", {}, "Lessons"), h("span", {}, total + " min")),
    list,
    h("h2", {}, h("span", {}, m.group === 1 ? "In the repo" : "Where it comes in")),
    h("div", { class: "lab" }, h("b", {}, m.data), h("code", { class: "run" }, m.run)),
  )
}
function updateProgress() {
  const all = MODULES.reduce((a, m) => a + m.lessons.length, 0)
  const n = Object.keys(done).filter((k) => MODULES.some((m) => k.startsWith(m.id + ":"))).length
  $("#progress-readout").innerHTML = `progress <b>${n} / ${all}</b> lessons · project 1 <b>2 of 8</b> build steps done`
  ;[...row.children].forEach((b, i) => b.style.setProperty("--p", progress(i)))
}
function go(i, fromHash) {
  active = (i + MODULES.length) % MODULES.length
  current?.dispose?.()
  stage.replaceChildren()
  controls.replaceChildren()
  current = MODULES[active].make(stage, controls)
  if (MODULES[active].data.startsWith("simulated") && !stage.querySelector(".tag")) stage.firstChild?.prepend?.(h("span", { class: "tag" }, "simulated preview"))
  ;[...row.children].forEach((b, k) => b.setAttribute("aria-current", String(k === active)))
  drawArcs()
  renderLesson()
  updateProgress()
  lesson.scrollTop = 0
  if (!fromHash && location.hash !== "#" + MODULES[active].id) history.replaceState(null, "", "#" + MODULES[active].id)
  renderTray()
}
function renderTray() {
  const items = current?.telemetry?.() || []
  tray.innerHTML = `<span><b>${MODULES[active].n}</b> ${MODULES[active].name}</span>` + items.map(([k, v, isHot]) => `<span class="${isHot ? "hot" : ""}">${k} <b>${v}</b></span>`).join("") + `<span class="hint">← → switch modules</span>`
}
function loop(t) {
  requestAnimationFrame(loop)
  try { current?.frame?.(t) } catch (err) { console.error(err) }
}
document.addEventListener("keydown", (e) => {
  if (e.target.closest("textarea, input, [role=slider]")) return
  if (e.key === "ArrowRight") go(active + 1)
  if (e.key === "ArrowLeft") go(active - 1)
})
window.addEventListener("resize", drawArcs)
window.addEventListener("hashchange", () => { const i = MODULES.findIndex((m) => "#" + m.id === location.hash); if (i >= 0 && i !== active) go(i, true) })
setInterval(renderTray, 250)
buildSeq()
const start = MODULES.findIndex((m) => "#" + m.id === location.hash)
go(start >= 0 ? start : 2, true)
requestAnimationFrame(loop)
document.fonts?.ready.then(drawArcs)
</script>
